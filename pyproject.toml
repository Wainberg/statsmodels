[build-system]
requires = [
    "setuptools>=69.0.2",
    "cython>=3.0.10,<4",
    "numpy>=2.0.0,<3",
    "scipy>=1.13,<2",
]
build-backend = "setuptools.build_meta"

[project]
name = "statsmodels"
version = "0.15.0.dev0" # Static version to solve build issues

description = "Statistical computations and models for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "License :: OSI Approved :: BSD License",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy<3,>=1.22.3",
    "scipy!=1.9.2,>=1.8",
    "pandas!=2.1.0,>=1.4",
    "patsy>=0.5.6",
    "packaging>=21.3",
    "formulaic>=1.1.0"
]

[project.urls]
"Bug Tracker" = "https://github.com/statsmodels/statsmodels/issues"
"Documentation" = "https://www.statsmodels.org/stable/index.html"
"Source Code" = "https://github.com/statsmodels/statsmodels"
